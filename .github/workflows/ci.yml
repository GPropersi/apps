name: CI

# The repo's lint + test gate (a PR runs the selected tests like the push gate in CLAUDE.md; main runs them all), on
# every PR into main and on main itself. Public repo rules: never use `pull_request_target`, never reference secrets
# here; deploy jobs run only on `push` or `workflow_dispatch` from main, and any job with `environment:` must carry a job-level
#   if: github.ref == 'refs/heads/main'
# (never mentioning event_name == 'pull_request') so it can never run for a fork PR; make lint enforces both.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the gate only needs to read the checked-out code.
permissions:
  contents: read

# Supersede an in-flight run when a PR gets new pushes.
concurrency:
  # A pull request run is superseded per ref; each push to main gets its own group so a queued merge is never collapsed
  # (a dropped run would lose that merge's deploy).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # After a merge to main: which apps changed, then app-deploy.yml tests, builds and deploys each one on its own. Neither
  # job exists for a pull request (the push+main guard), so a fork PR never reaches a build, a secret or an environment.
  # The `ci` job below runs the full suite on the same push; its failure reports red but never blocks a deploy.
  detect:
    name: detect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
      has_apps: ${{ steps.changed.outputs.has_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the before sha must resolve
      - name: List the changed apps
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          apps="$(platform/ci/changed-apps.sh "$BEFORE_SHA" "$AFTER_SHA")"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          if [ "$(jq 'length' <<< "$apps")" -eq 0 ]; then
            echo "has_apps=false" >> "$GITHUB_OUTPUT"
            echo "detect: no app changed"
          else
            echo "has_apps=true" >> "$GITHUB_OUTPUT"
            echo "detect: changed apps $apps"
          fi

  # packages: write here is the ceiling for every job app-deploy.yml reaches (a called workflow's token can only be
  # narrower than its caller's); it also covers the deploy job's packages: read. The ci job keeps contents: read only.
  app-deploy:
    name: app-deploy
    needs: detect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.has_apps == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/app-deploy.yml
    # Passes the environment secrets down to the deploy job (see app-deploy.yml); no repository-level secrets exist.
    secrets: inherit
    with:
      apps: ${{ needs.detect.outputs.apps }}

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # make test-changed diffs against the pull request base sha
      # The runner image's shellcheck is an older apt build that differs from local, so pin one exact release.
      # The version lives in platform/lint/SHELLCHECK_VERSION (make lint enforces it); bumping it means updating
      # SHELLCHECK_SHA256 to the new linux.x86_64 tarball's checksum.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          version="$(cat platform/lint/SHELLCHECK_VERSION)"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/shellcheck-bin"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/shellcheck-bin" --strip-components=1 "shellcheck-v${version}/shellcheck"
          echo "${RUNNER_TEMP}/shellcheck-bin" >> "${GITHUB_PATH}"
      # No separate Go install: the runner image's preinstalled Go (>= 1.21) downloads the exact toolchain named
      # in platform/jobs/GO_VERSION, because make lint and platform/jobs/test_go.sh export GOTOOLCHAIN=go<version>.
      # The toolchain and modules come from the Go cache restored below, so the module proxy is needed only on a cache
      # miss (a network flake can still fail a cold run). There is no second pin.
      # test_backup_live.sh needs restic on PATH, and REQUIRE_DOCKER=1 (set on the Test step) turns its skip into a failure.
      # The runner image has no restic, so pin the same release install-backup.sh installs on the host (0.18.1); bumping it
      # means updating RESTIC_SHA256 to the new linux_amd64 archive's checksum from the release's SHA256SUMS file.
      - name: Install pinned restic
        env:
          RESTIC_VERSION: "0.18.1"
          RESTIC_SHA256: 680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d
        run: |
          archive="restic_${RESTIC_VERSION}_linux_amd64.bz2"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/${archive}"
          echo "${RESTIC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/restic-bin"
          bzip2 -dc "${RUNNER_TEMP}/${archive}" > "${RUNNER_TEMP}/restic-bin/restic"
          chmod 0755 "${RUNNER_TEMP}/restic-bin/restic"
          echo "${RUNNER_TEMP}/restic-bin" >> "${GITHUB_PATH}"
      # Go modules and the build cache are restored on every run (the pinned toolchain lives in the module cache) and
      # saved only by a push to main, so pull-request code never writes a cache. The key follows the pinned Go version
      # and go.sum; the prefix restore-key falls back to the newest cache of the same Go version.
      - name: Restore Go cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('platform/jobs/GO_VERSION') }}-${{ hashFiles('platform/jobs/go.sum', 'templates/*/go.sum', 'apps/*/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('platform/jobs/GO_VERSION') }}-
      - name: Lint
        run: make lint
      # Real-Redis checks must run (not skip) in CI: REQUIRE_DOCKER=1 turns a missing docker or image into a failure.
      # The script prints "cannot pull <image>" when the registry was unreachable (not a code failure) and
      # "(build or test failure, not an image pull)" for a build or test failure against the pinned Redis; read the
      # step log for which one it was.
      # test_jobs_image.sh builds both images from the installer's embedded sources alone, so a broken payload fails here.
      # make test runs test_jobs_live.sh and test_jobs_image.sh too, so the flag is set on this one step (no second run).
      # A pull request runs only the tests its diff needs (platform/test/areas.map); every push to main runs the whole
      # suite, which catches a wrong map. A change under .github/** alone selects only the lint and ci tests. run.sh
      # prewarms the selected files' images and the Go toolchain once before they run side by side. The job is always
      # `ci`, so the required check reports on every pull request.
      - name: Test
        env:
          REQUIRE_DOCKER: "1"
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            make test-changed BASE="$BASE_SHA"
          else
            make test
          fi
      # Last step, after Test: only a push to main saves the cache (restore-only everywhere else).
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('platform/jobs/GO_VERSION') }}-${{ hashFiles('platform/jobs/go.sum', 'templates/*/go.sum', 'apps/*/go.sum') }}
