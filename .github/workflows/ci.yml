name: CI

# The repo's lint + test gate (same commands as the push gate in CLAUDE.md), on every PR into main
# and on main itself. Public repo rules: never use `pull_request_target`, never reference secrets
# here, and any future deploy job must carry
#   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
# so it can never run for a fork PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the gate only needs to read the checked-out code.
permissions:
  contents: read

# Supersede an in-flight run when a PR gets new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's shellcheck is an older apt build that differs from local, so pin one exact release.
      # The version lives in platform/lint/SHELLCHECK_VERSION (make lint enforces it); bumping it means updating
      # SHELLCHECK_SHA256 to the new linux.x86_64 tarball's checksum.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          version="$(cat platform/lint/SHELLCHECK_VERSION)"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/shellcheck-bin"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/shellcheck-bin" --strip-components=1 "shellcheck-v${version}/shellcheck"
          echo "${RUNNER_TEMP}/shellcheck-bin" >> "${GITHUB_PATH}"
      # No separate Go install: the runner image's preinstalled Go (>= 1.21) downloads the exact toolchain named
      # in platform/jobs/GO_VERSION, because make lint and platform/jobs/test_go.sh export GOTOOLCHAIN=go<version>.
      # That needs the module proxy on each run; a network flake fails CI. There is no second pin.
      # test_backup_live.sh needs restic on PATH, and REQUIRE_DOCKER=1 (set on the Test step) turns its skip into a failure.
      # The runner image has no restic, so pin the same release install-backup.sh installs on the host (0.18.1); bumping it
      # means updating RESTIC_SHA256 to the new linux_amd64 archive's checksum from the release's SHA256SUMS file.
      - name: Install pinned restic
        env:
          RESTIC_VERSION: "0.18.1"
          RESTIC_SHA256: 680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d
        run: |
          archive="restic_${RESTIC_VERSION}_linux_amd64.bz2"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/${archive}"
          echo "${RESTIC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/restic-bin"
          bzip2 -dc "${RUNNER_TEMP}/${archive}" > "${RUNNER_TEMP}/restic-bin/restic"
          chmod 0755 "${RUNNER_TEMP}/restic-bin/restic"
          echo "${RUNNER_TEMP}/restic-bin" >> "${GITHUB_PATH}"
      - name: Lint
        run: make lint
      # Real-Redis checks must run (not skip) in CI: REQUIRE_DOCKER=1 turns a missing docker or image into a failure.
      # The script prints "cannot pull <image>" when the registry was unreachable (not a code failure) and
      # "(build or test failure, not an image pull)" for a build or test failure against the pinned Redis; read the
      # step log for which one it was.
      # test_jobs_image.sh builds both images from the installer's embedded sources alone, so a broken payload fails here.
      # make test runs test_jobs_live.sh and test_jobs_image.sh too, so the flag is set on this one step (no second run).
      - name: Test
        env:
          REQUIRE_DOCKER: "1"
        run: make test
