name: CI

# The repo's lint + test gate (same commands as the push gate in CLAUDE.md), on every PR into main
# and on main itself. Public repo rules: never use `pull_request_target`, never reference secrets
# here, and any future deploy job must carry
#   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
# so it can never run for a fork PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the gate only needs to read the checked-out code.
permissions:
  contents: read

# Supersede an in-flight run when a PR gets new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's shellcheck is an older apt build that differs from local, so pin one exact release.
      # The version lives in platform/lint/SHELLCHECK_VERSION (make lint enforces it); bumping it means updating
      # SHELLCHECK_SHA256 to the new linux.x86_64 tarball's checksum.
      - name: Install pinned shellcheck
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          version="$(cat platform/lint/SHELLCHECK_VERSION)"
          archive="shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" "https://github.com/koalaman/shellcheck/releases/download/v${version}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/shellcheck-bin"
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/shellcheck-bin" --strip-components=1 "shellcheck-v${version}/shellcheck"
          echo "${RUNNER_TEMP}/shellcheck-bin" >> "${GITHUB_PATH}"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
